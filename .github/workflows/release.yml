# .github/workflows/release.yml
#
# Every merge to main builds an image and publishes a GitHub Release with release.json.
# It never deploys: Kraken (kraken.skelstar.io) reads the release and deploys it when you
# press the button. If Kraken is down, deploy by editing newTag and digest in
# Tatooine-Configuration/deployments/activity-logger/k8s/kustomization.yaml.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 2.0.0). Leave blank to bump the minor version"
        required: false

# Releases are numbered from the latest tag, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/skelstar/activity-logger
  # Used only for the very first release, continuing from the last version deployed the old way.
  FIRST_VERSION: 1.16.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub Release
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: yarn install --frozen-lockfile

      # A commit that fails these never becomes an image or a release.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: |
          if node -e "process.exit(require('./client/package.json').scripts?.test ? 0 : 1)"; then
            yarn workspace activity-logger-client test
          else
            echo "client has no test script yet, skipping"
          fi

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          valid() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; }
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')

          if [[ -n "$REQUESTED" ]]; then
            valid "$REQUESTED" || { echo "::error::Version '$REQUESTED' must be X.Y.Z"; exit 1; }
            if [[ -n "$latest" ]] && [[ "$(printf '%s\n%s\n' "$latest" "$REQUESTED" | sort -V | tail -n1)" != "$REQUESTED" || "$REQUESTED" == "$latest" ]]; then
              echo "::error::Version $REQUESTED must be greater than the latest release $latest"; exit 1
            fi
            version="$REQUESTED"
          elif [[ -z "$latest" ]]; then
            version="$FIRST_VERSION"
          else
            IFS=. read -r major minor _patch <<<"$latest"
            version="$major.$((minor + 1)).0"
          fi

          echo "Latest release: ${latest:-none}. New release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # release.json is what Kraken reads. The digest pins exactly what was built,
      # so staging and production run the same image.
      - name: Write release.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::No image digest from the build"; exit 1; }
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg app "$IMAGE@$DIGEST" \
            '{project: "activity-logger", version: $version, commit: $commit, migrations: false, images: {app: $app}}' \
            > release.json
          cat release.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release.json \
            --target "$GITHUB_SHA" \
            --title "activity-logger $VERSION" \
            --generate-notes
